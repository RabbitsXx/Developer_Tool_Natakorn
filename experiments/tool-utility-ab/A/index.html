<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Tool Natakorn</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f7f8fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(100% - 2rem, 720px);
      margin: 0 auto;
      padding: clamp(3rem, 12vw, 7rem) 0;
    }
    section {
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid #e1e6f0;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 6%);
    }
    .eyebrow { color: #52627d; font-size: .9rem; }
    h1 { margin: .75rem 0 1rem; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.15; }
    p { color: #52627d; line-height: 1.75; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: .8rem 1.1rem;
      border-radius: .7rem;
      background: #2457d6;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #1945b5; }
    a:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="page-title">
      <p class="eyebrow">Developer Tool Natakorn</p>
      <h1 id="page-title">เครื่องมือสำหรับนักพัฒนา</h1>
      <p>ดูซอร์สโค้ดและวิธีเริ่มต้นใช้งานได้จากหน้า GitHub ของโปรเจกต์</p>
      <a href="https://github.com/RabbitsXx/Developer_Tool_Natakorn">
        เปิดโปรเจกต์บน GitHub
      </a>
    </section>
  </main>
</body>
</html>
